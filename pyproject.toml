[project]
name = "hnradar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sham", email = "shassanchi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "typer>=0.28.0",
]

[project.scripts]
hnradar = "hnradar:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

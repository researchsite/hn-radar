<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company page | HN Radar | RawWeights</title>
  <meta name="description" content="A company's hiring post on Hacker News, its Show HN posts, and what their users said, with a link to every comment.">
  <meta name="author" content="RawWeights">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://rawweights.com/careers/company.html">

  <script>(function(){var t=localStorage.getItem('rw-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>

  <link rel="stylesheet" href="../includes/brand.css">
  <link rel="stylesheet" href="./hn.css">
  <script type="text/javascript" async src="../includes/analytics.js"></script>
</head>
<body>

<div id="rw-nav"></div>
<script src="../includes/rw-nav.js?v=20261106"></script>

<div id="content" class="rw-hn-wrap">
  <div id="hn-pages"></div>
  <p class="rw-hn-small"><a class="rw-hn-link" href="./index.html">&larr; All jobs</a></p>
  <h1 id="co-title">Company page</h1>
  <p class="rw-hn-lead">The hiring post, the company's Show HN posts, and what the people on those threads said. Every point links to the Hacker News comment it came from.</p>

  <div id="co-state" class="rw-hn-state" role="status" hidden></div>
  <div id="co-out" hidden></div>
</div>

<div id="rw-footer" data-linkedin="" data-related='[]'></div>
<script src="../includes/rw-footer.js?v=20261107"></script>

<script src="./hn.js"></script>
<script>
(function () {
  'use strict';
  var H = window.HN, el = H.el, clean = H.clean;
  var $ = function (id) { return document.getElementById(id); };
  document.getElementById('hn-pages').appendChild(H.pages('company.html'));

  var KINDS = [['pro', 'What they like'], ['bug', 'What broke'], ['ask', 'What they ask for']];
  var pulseToken = 0;

  function section(title, intro) {
    var s = el('section', { className: 'rw-hn-section rw-hn-panel' });
    s.appendChild(el('h2', {}, title));
    if (intro) s.appendChild(el('p', { className: 'rw-hn-muted rw-hn-small' }, intro));
    return s;
  }
  function noteBox(text, warn) { return el('p', { className: 'rw-hn-note' + (warn ? ' rw-hn-note--warn' : '') }, text); }
  // A designed state inside a section: a title and a sentence, never a bare error
  function stateBox(title, text) { var d = el('div', { className: 'rw-hn-state' }); d.appendChild(el('strong', {}, title)); d.appendChild(el('span', {}, text)); return d; }
  function isMissing(e) { return e && e.message === 'HTTP 404'; }
  function int(n) { return typeof n === 'number' && isFinite(n) && Math.floor(n) === n; }

  // ---- 1. the hiring post ----
  function renderPost(j) {
    var s = section('The hiring post', 'Parsed from the post by a program; the fields can be wrong. The post and the HN comment are the source of truth.');
    var dl = el('dl', { className: 'rw-hn-facts' });
    function row(k, v) { dl.appendChild(el('dt', {}, k)); dl.appendChild(el('dd', {}, v)); }
    row('Role', j.role || el('span', { className: 'rw-hn-muted' }, 'not stated'));
    row('Location', j.location || el('span', { className: 'rw-hn-muted' }, 'not stated'));
    row('Remote', H.remoteLabel({ remote: j.remote }));
    var tech = j.stack.length ? el('ul', { className: 'rw-hn-chips' }, j.stack.map(function (t) { return el('li', {}, el('span', { className: 'rw-hn-tag' }, t)); })) : el('span', { className: 'rw-hn-muted' }, 'none recognised');
    row('Technologies', tech);
    row('Original', H.extLink(H.hnItemUrl(j.id), 'HN comment ' + j.id, 'HN comment ' + j.id));
    row('Job link', j.url ? H.extLink(j.url.href, j.url.host, 'Job link ' + j.url.host) : el('span', { className: 'rw-hn-muted' }, 'no link in the post'));
    s.appendChild(dl);
    // closed is evidence, not status: only said when the poster's own reply is cited
    if (j.closed && H.hnItemUrl(j.closedId)) {
      s.appendChild(el('p', { className: 'rw-hn-note rw-hn-note--warn' }, ['The poster\'s own reply says this job may be closed: ', H.extLink(H.hnItemUrl(j.closedId), 'HN comment ' + j.closedId, 'HN comment ' + j.closedId), '. Not seeing this notice does not mean the job is open.']));
    }
    s.appendChild(el('h3', {}, 'What the post says'));
    s.appendChild(j.text ? el('p', { className: 'rw-hn-post' }, j.text) : el('p', { className: 'rw-hn-muted' }, 'The post has no text.'));
    return s;
  }

  // ---- 2. Show HN candidates ----
  function checkShowHN(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not an object');
    if (!int(d.total_hits) || d.total_hits < 0) throw new Error('total_hits');
    if (d.candidates !== undefined && !Array.isArray(d.candidates)) throw new Error('candidates');
  }
  function renderShowHN(d, company, pulseHost) {
    var s = section('Show HN posts', 'Stories on Hacker News whose title mentions the company. A story that links to the company\'s own domain is a stronger match than a name match.');
    var cands = (d.candidates || []).filter(function (c) { return c && typeof c === 'object' && H.hnItemUrl(c.story_id) && typeof c.title === 'string'; });
    if (!cands.length) {
      s.appendChild(stateBox('No Show HN post found', 'Nothing on Hacker News matched "' + clean(d.query || company) + '" as a Show HN post. This is a normal result: not every company has one.'));
      pulseHost.appendChild(stateBox('Nothing to summarise', 'The pulse is built from a Show HN thread, and none was found for this company.'));
      return s;
    }
    if (d.low_confidence) s.appendChild(noteBox('Low confidence: none of these stories links to the company\'s own domain, so they may be about a different company with a similar name. Check each one before relying on it.', true));
    var total = d.total_hits;
    s.appendChild(el('p', { className: 'rw-hn-count' }, d.truncated || total > cands.length ? 'Showing ' + cands.length + ' of ' + total + ' matching stories' : cands.length + (cands.length === 1 ? ' story' : ' stories')));
    var ul = el('ul', { className: 'rw-hn-list' });
    cands.forEach(function (c) {
      var li = el('li', { className: 'rw-hn-item' });
      li.appendChild(el('h3', {}, H.extLink(H.hnItemUrl(c.story_id), clean(c.title), 'Hacker News story ' + c.story_id)));
      var meta = [int(c.points) ? c.points + ' points' : null, int(c.num_comments) ? c.num_comments + ' comments' : null].filter(Boolean).join(' · ');
      var kids = [c.domain_match === true ? el('span', { className: 'rw-hn-badge rw-hn-badge--note' }, 'Links to the company domain') : el('span', { className: 'rw-hn-badge rw-hn-badge--warn' }, 'Name match only')];
      if (meta) kids.push(el('span', { className: 'rw-hn-meta' }, meta));
      var u = H.safeUrl(c.url); if (u) kids.push(H.extLink(u.href, u.host, 'Story link ' + u.host));
      li.appendChild(el('p', { className: 'rw-hn-actions' }, kids));
      ul.appendChild(li);
    });
    s.appendChild(ul);

    // the pulse follows the stories: a picker when there is more than one
    var first = cands.filter(function (c) { return c.domain_match === true; })[0] || cands[0];
    pulseHost.appendChild(el('p', { className: 'rw-hn-muted rw-hn-small' }, 'What the people on a Show HN thread said, grouped into what they like, what broke and what they asked for.'));
    var body = el('div', { id: 'co-pulse-body' });
    if (cands.length > 1) {
      var sel = el('select', { id: 'co-pulse-pick' });
      cands.forEach(function (c) { sel.appendChild(el('option', { value: String(c.story_id) }, clean(c.title).slice(0, 90))); });
      sel.value = String(first.story_id);
      sel.addEventListener('change', function () { loadPulse(parseInt(sel.value, 10), body); });
      pulseHost.appendChild(el('div', { className: 'rw-hn-field', style: 'max-width:520px;margin-bottom:12px' }, [el('label', { 'for': 'co-pulse-pick' }, 'Pulse for'), sel]));
    }
    pulseHost.appendChild(body);
    loadPulse(first.story_id, body);
    return s;
  }

  // ---- 3. pulse (pros, bugs, asks) ----
  function checkPulse(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not an object');
    if (['ok', 'not_enough_signal'].indexOf(d.status) === -1) throw new Error('status');
    if (!Array.isArray(d.items)) throw new Error('items');
  }
  function renderPulse(d) {
    var wrap = el('div');
    if (d.status === 'not_enough_signal') {
      wrap.appendChild(stateBox('Not enough signal', 'This thread has ' + (int(d.thread_comment_count) ? d.thread_comment_count : 'too few') + ' comments, which is not enough to say what people think. Nothing is guessed.'));
      return wrap;
    }
    var dropped = 0, cols = el('div', { className: 'rw-hn-cols' });
    KINDS.forEach(function (k) {
      var col = el('div', { className: 'rw-hn-col' });
      col.appendChild(el('h3', {}, k[1]));
      var ul = el('ul', { className: 'rw-hn-points' }), n = 0;
      d.items.forEach(function (it) {
        if (!it || it.kind !== k[0] || typeof it.summary !== 'string') return;
        var ids = (Array.isArray(it.comment_ids) ? it.comment_ids : []).filter(function (id) { return int(id) && H.hnItemUrl(id); });
        if (!ids.length) { dropped++; return; }   // a point with no source comment is never shown (AGENTS.md rule 1)
        var li = el('li', { className: 'rw-hn-point' });
        li.appendChild(el('p', {}, clean(it.summary)));
        if (int(it.mention_count) && it.mention_count > 0) li.appendChild(el('p', { className: 'rw-hn-small rw-hn-muted' }, it.mention_count === 1 ? 'Said in 1 comment' : 'Said in ' + it.mention_count + ' comments'));
        li.appendChild(H.citations(ids));
        ul.appendChild(li); n++;
      });
      col.appendChild(n ? ul : el('p', { className: 'rw-hn-muted rw-hn-small' }, 'Nothing in this thread.'));
      cols.appendChild(col);
    });
    wrap.appendChild(cols);
    if (dropped) wrap.appendChild(noteBox(dropped + (dropped === 1 ? ' point is' : ' points are') + ' not shown because ' + (dropped === 1 ? 'it has' : 'they have') + ' no source comment on Hacker News.', true));
    var story = int(d.story_id) && H.hnItemUrl(d.story_id) ? H.extLink(H.hnItemUrl(d.story_id), 'the Show HN thread', 'Show HN thread ' + d.story_id) : 'the thread';
    wrap.appendChild(el('p', { className: 'rw-hn-note' }, ['Summaries were written by a model' + (typeof d.model === 'string' && clean(d.model) ? ' (' + clean(d.model) + ')' : '') + ' and can be wrong. The comments are the source: open them in ', story, '.']));
    return wrap;
  }
  function loadPulse(storyId, body) {
    var token = ++pulseToken;
    body.textContent = '';
    body.appendChild(el('p', { className: 'rw-hn-muted' }, 'Loading the pulse...'));
    H.loadJSON(H.paths.data + 'pulse/' + storyId + '.json', checkPulse).then(function (d) {
      if (token !== pulseToken) return;
      body.textContent = ''; body.appendChild(renderPulse(d));
    }).catch(function (e) {
      if (token !== pulseToken) return;
      body.textContent = '';
      body.appendChild(isMissing(e)
        ? stateBox('Pulse not produced yet', 'There is no pulse file for this Show HN thread yet. When it exists, what people liked, what broke and what they asked for appears here, each with links to the comments.')
        : stateBox('The pulse could not be read', 'The pulse file for this thread is not valid, so nothing is shown from it.'));
    });
  }

  // ---- page ----
  function prep(j) {
    return { id: parseInt(j.comment_id, 10), company: clean(j.company), role: clean(j.role), location: clean(j.location),
      remote: j.remote === true ? true : j.remote === false ? false : null,
      stack: (Array.isArray(j.stack) ? j.stack : []).map(clean).filter(Boolean), url: H.safeUrl(j.url), text: H.cleanBlock(j.raw_text),
      closed: j.closed === true, closedId: j.closed_comment_id };
  }
  function show(title, text, action) { var st = $('co-state'); H.state(st, title, text, action); $('co-out').hidden = true; }

  function load() {
    var raw = new URLSearchParams(location.search).get('job'), id = H.hnItemUrl(raw) ? parseInt(raw, 10) : null;
    if (!id) { show('Choose a job', 'Open a job in the job explorer and follow its company link. This page needs a job in the address (company.html?job=...).', { label: 'Browse the jobs', run: function () { location.href = './index.html'; } }); return; }
    show('Loading', 'Reading the data file.');
    H.loadJSON(H.paths.data + 'jobs.json', H.jobsList).then(function (data) {
      var j = H.jobsList(data).filter(function (x) { return parseInt(x.comment_id, 10) === id; })[0];
      if (!j) { show('This job is not in the data', 'No post with that id is in the jobs file. It may be from another month.', { label: 'Browse the jobs', run: function () { location.href = './index.html'; } }); return; }
      var job = prep(j);
      $('co-title').textContent = job.company || 'Company not stated';
      document.title = (job.company || 'Company') + ' | HN Radar | RawWeights';
      var out = $('co-out'); out.textContent = '';
      out.appendChild(renderPost(job));
      var showSec = section('Show HN posts'), pulseSec = section('Pulse');
      out.appendChild(showSec); out.appendChild(pulseSec);
      $('co-state').hidden = true; out.hidden = false;
      H.loadJSON(H.paths.data + 'showhn/' + id + '.json', checkShowHN).then(function (d) {
        var host = el('div'); var built = renderShowHN(d, job.company, host);
        showSec.replaceWith(built); pulseSec.appendChild(host);
      }).catch(function (e) {
        showSec.appendChild(isMissing(e)
          ? stateBox('Show HN data not produced yet', 'The Show HN lookup for this company has not been saved yet, so no stories are shown. This is not an error with the page.')
          : stateBox('The Show HN data could not be read', 'The file for this job is not valid, so nothing is shown from it.'));
        pulseSec.appendChild(stateBox('Nothing to summarise yet', 'The pulse is built from a Show HN thread, and there is no Show HN data for this job yet.'));
      });
    }).catch(function () {
      show('The jobs data could not be loaded', 'The file data/jobs.json is missing or is not a list of posts.', { label: 'Try again', run: load });
    });
  }
  load();
})();
</script>
</body>
</html>
